name: Build Coral KSU Kernel

on:
  workflow_dispatch:
    inputs:
      extraversion:
        description: 'Kernel EXTRAVERSION suffix'
        required: false
        default: '-KSU-SUSFS-coral'
        type: string

concurrency:
  group: build-coral-ksu
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      # Direct clone of kernel/msm (no manifest). coral 4.14 source.
      KERNEL_SOURCE_URL: https://android.googlesource.com/kernel/msm
      KERNEL_SOURCE_BRANCH: android-msm-coral-4.14-android10-qpr3
      BUILD_ID: QQ3A.200805.001
      KERNEL_DEFCONFIG: floral_defconfig
      KSU_TAG: v3.1.0-legacy-susfs
      KERNEL_DIR: kernel
      OUT_DIR: out
      AK3_DIR: anykernel3
      # Clang 12 (r416183b) — last AOSP Clang that compiles 4.14 msm cleanly.
      # Clang 14+ rejects __builtin_constant_p stricter and rejects
      # arch/arm64's `mgeneral-regs-only` differently; 4.14 msm was written
      # for Clang 12.
      CLANG_URL: https://codeload.github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/tar.gz/refs/heads/lineage-20.0
      EXTRAVERSION: ${{ github.event.inputs.extraversion }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: kernel-build

      - name: Install apt deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget build-essential bc flex bison \
            libssl-dev libelf-dev lz4 lzop cpio unzip zip python3 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libncurses-dev zlib1g-dev ccache

      - name: Setup ccache
        run: |
          mkdir -p ~/.cache/ccache ~/.ccache
          echo "max_size = 10G" > ~/.ccache/ccache.conf
          ccache -M 10G || true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            kernel-build/clang-r416183b
          key: coral-ksu-${{ github.run_id }}
          restore-keys: coral-ksu-

      - name: Clone kernel source (direct git, no manifest)
        working-directory: kernel-build
        run: bash scripts/0-prep-kernel.sh

      - name: Fetch Clang 12 toolchain (r416183b)
        working-directory: kernel-build
        run: bash scripts/0b-fetch-clang.sh

      - name: Fetch GCC 4.9 prebuilts (aarch64 + arm)
        working-directory: kernel-build
        run: bash scripts/0c-fetch-gcc.sh

      - name: Setup KSU Next (manual hooks)
        working-directory: kernel-build
        run: bash scripts/1-setup-ksu.sh

      - name: Apply manual-hooks patches
        working-directory: kernel-build
        run: bash scripts/2-apply-patches.sh

      - name: Configure kernel
        working-directory: kernel-build
        run: bash scripts/3-configure.sh

      - name: Build kernel (direct make, LLVM=0 + CC=clang)
        working-directory: kernel-build
        run: bash scripts/4-build.sh

      - name: Verify KSU symbols
        working-directory: kernel-build
        run: bash scripts/5-verify-symbols.sh

      - name: Locate kernel image
        working-directory: kernel-build
        run: |
          find "$OUT_DIR" -name 'Image.gz-dtb' -o -name 'Image.lz4-dtb' -o -name 'Image' 2>/dev/null | head -5

      - name: Package AnyKernel3 zip
        working-directory: kernel-build
        run: bash scripts/6-package-ak3.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-coral-${{ github.run_number }}
          path: kernel-build/AnyKernel3-coral-*.zip
          retention-days: 30
          if-no-files-found: error
