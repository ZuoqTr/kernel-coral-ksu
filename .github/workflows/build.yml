name: Build Coral KSU Kernel

on:
  workflow_dispatch:
    inputs:
      extraversion:
        description: 'Kernel EXTRAVERSION suffix'
        required: false
        default: '-KSU-SUSFS-coral'
        type: string

concurrency:
  group: build-coral-ksu
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      KERNEL_SOURCE_URL: https://android.googlesource.com/kernel/msm
      KERNEL_SOURCE_BRANCH: android-msm-coral-4.14-android10-qpr3
      KERNEL_DEFCONFIG: floral_defconfig
      KSU_TAG: v3.1.0-legacy-susfs
      KERNEL_DIR: kernel
      OUT_DIR: out
      AK3_DIR: anykernel3
      GCC_64_DIR: ${{ github.workspace }}/gcc-64
      GCC_32_DIR: ${{ github.workspace }}/gcc-32
    steps:
      - uses: actions/checkout@v4
        with:
          path: kernel-build

      - name: Install Clang + apt deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget build-essential bc flex bison \
            libssl-dev libelf-dev lz4 lzop cpio unzip zip python3 \
            clang llvm lld \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf \
            libncurses-dev zlib1g-dev ccache
          clang --version | head -1
          # Do NOT install gcc-aarch64-linux-gnu. We use AOSP GCC 4.9 instead.

      - name: Setup ccache
        run: |
          mkdir -p ~/.cache/ccache ~/.ccache
          echo "max_size = 10G" > ~/.ccache/ccache.conf
          ccache -M 10G || true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ${{ github.workspace }}/gcc-64
            ${{ github.workspace }}/gcc-32
          key: ccache-coral-ksu-${{ github.run_id }}
          restore-keys: |
            ccache-coral-ksu-
            gcc-64-
            gcc-32-

      - name: Clone GCC 4.9 (64-bit, AOSP android12L-release)
        run: |
          if [ ! -d "$GCC_64_DIR/bin" ]; then
            git clone --depth=1 -b android12L-release \
              https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
              "$GCC_64_DIR"
          fi
          ls "$GCC_64_DIR/bin/" | head -5
          "$GCC_64_DIR/bin/aarch64-linux-android-gcc" --version | head -1

      - name: Clone GCC 4.9 (32-bit, AOSP android12L-release)
        run: |
          if [ ! -d "$GCC_32_DIR/bin" ]; then
            git clone --depth=1 -b android12L-release \
              https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
              "$GCC_32_DIR"
          fi
          ls "$GCC_32_DIR/bin/" | head -5
          "$GCC_32_DIR/bin/arm-linux-androideabi-gcc" --version | head -1

      - name: Clone kernel source
        working-directory: kernel-build
        run: bash scripts/0-prep-kernel.sh

      - name: Append EXTRAVERSION
        working-directory: kernel-build/kernel
        run: |
          if ! grep -q "^EXTRAVERSION = " Makefile; then
            echo 'EXTRAVERSION = ${{ github.event.inputs.extraversion }}' >> Makefile
          fi
          grep EXTRAVERSION Makefile | tail -3

      - name: Setup KSU Next
        working-directory: kernel-build
        run: bash scripts/1-setup-ksu.sh

      - name: Apply manual hook patches
        working-directory: kernel-build
        run: bash scripts/2-apply-patches.sh

      - name: Configure kernel
        working-directory: kernel-build
        run: bash scripts/3-configure.sh

      - name: Build kernel
        working-directory: kernel-build
        run: bash scripts/4-build.sh

      - name: Verify KSU symbols
        working-directory: kernel-build
        run: bash scripts/5-verify-symbols.sh

      - name: Locate kernel image
        working-directory: kernel-build/kernel
        run: |
          ls -lh out/arch/arm64/boot/Image* 2>&1 || true
          file out/arch/arm64/boot/Image.gz-dtb 2>&1 || true

      - name: Package AnyKernel3 zip
        working-directory: kernel-build
        run: bash scripts/6-package-ak3.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-coral-${{ github.run_number }}
          path: kernel-build/AnyKernel3-coral-*.zip
          retention-days: 30
          if-no-files-found: error